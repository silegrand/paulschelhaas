    <style>
        /* CSS Variables - Light Theme */
        :root {
            --bg-main: #F9FAFB;      /* Off-white background */
            --bg-card: #FFFFFF;      /* Pure white for cards */
            --accent: #FF6B00;       /* Solar/Deep Tech Orange */
            --text-main: #111827;    /* Near black for high contrast */
            --text-muted: #4B5563;   /* Medium dark grey for secondary text */
            --border: #E5E7EB;       /* Light grey borders */
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #E05D00;
        }

        /* Layout Utility */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 6rem 0;
            border-bottom: 1px solid var(--border);
        }

        section:last-child {
            border-bottom: none;
        }

            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }
