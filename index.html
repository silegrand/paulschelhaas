        /* CSS Variables - Light Theme */
        :root {
            --bg-main: #F9FAFB;
            --bg-card: #FFFFFF;
            --accent: #FF6B00;
            --text-main: #111827;
            --text-muted: #4B5563;
            --border: #E5E7EB;
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #E05D00;
        }

        /* Layout Utility */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 6rem 0;
            border-bottom: 1px solid var(--border);
        }

        section:last-child {
            border-bottom: none;
        }

        /* Typography */
        h1, h2, h3 {
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .section-tag {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            display: inline-block;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.08) 0%, var(--bg-main) 60%);
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .hero h2 {
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 400;
            color: var(--text-muted);
            max-width: 800px;
            margin-bottom: 2.5rem;
        }

        .hero .highlight {
            color: var(--accent);
            font-weight: 600;
        }

            display: flex;
            gap: 3rem;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

            display: flex;
            flex-direction: column;
        }

        .stat-num {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-main);
        }
